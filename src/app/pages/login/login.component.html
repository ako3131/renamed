<main class="shell">
  <section class="panel">
    <header class="header">
      <h1>Ready to rename your friends?</h1>
    </header>

    <form class="card" (ngSubmit)="login()">

      <label class="visually-hidden" for="username">
        Username
      </label>

      <input
        id="username"
        class="text-input"
        type="text"
        name="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        placeholder="Enter a username"
        autocomplete="off"
        spellcheck="false"
        required
      />

      <button class="action-button" type="submit">
        Continue
      </button>
    </form>

  </section>
</main>
