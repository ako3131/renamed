<main class="shell">
  <section class="panel">
    <div class="header-row">
        <button class="back-button" type="button" (click)="returnToLobby()">
            <span>Return to lobby</span>
        </button>
    </div>
    <header class="header">
      <h1>You are in room {{ roomname }}</h1>
    </header>

    @if (game; as room) {
      <section class="card">
        <h2>Players ({{ room.players.length }})</h2>

        <ul class="player-list">
          @for (player of room.players; track player.playerId) {
            <li>
              <span>{{ player.username }}</span>
              <span class="player-score">{{ scoreForPlayer(player.playerId) }} pts</span>
            </li>
          }
        </ul>

        <div class="actions">
          <button class="action-button" type="button" (click)="startGame()">
            Start game
          </button>
        </div>
      </section>
    } @else {
      <p class="description">This room is no longer available.</p>
    }
  </section>
</main>
