
<main class="shell">
  <form class="entry-form" (ngSubmit)="updateUsername(usernameInput.value)">
    <label class="visually-hidden" for="usernameInput">Username</label>
    <input
      id="usernameInput"
      class="username-input"
      type="text"
      [value]="user().username"
      #usernameInput
      autocomplete="off"
      spellcheck="false"
    />
    <button class="enter-button" type="submit">Enter</button>
  </form>
</main>
